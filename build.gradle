plugins {
    id 'java'
}

group = 'com.shawarmashop'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'org.assertj:assertj-core:3.27.7'

    testCompileOnly 'org.projectlombok:lombok:1.18.46'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.46'

    testImplementation 'tools.jackson.core:jackson-databind:3.2.1'
    testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.22.1'

    testImplementation 'org.aeonbits.owner:owner:1.0.12'

    testImplementation 'net.datafaker:datafaker:2.7.0'

    testImplementation 'org.postgresql:postgresql:42.7.13'

    testImplementation 'io.rest-assured:rest-assured:6.0.1'
    testImplementation 'io.qameta.allure:allure-rest-assured:2.35.4'

    testImplementation 'com.zaxxer:HikariCP:7.1.0'

}

test {
    useJUnitPlatform()
}
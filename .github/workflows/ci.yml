name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  api-tests:
    name: API & E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Start infrastructure
        run: docker compose up -d

      - name: Wait for services to be healthy
        run: |
          set -e
          echo "Waiting for all containers to report healthy..."
          for i in $(seq 1 60); do
            unhealthy=$(docker compose ps --format json \
              | jq -r 'select(.Health != "" and .Health != "healthy") | .Name' \
              | tr '\n' ' ')
            if [ -z "$unhealthy" ]; then
              echo "All services healthy."
              exit 0
            fi
            echo "[$i/60] Waiting for: $unhealthy"
            sleep 5
          done
          echo "::error::Timeout waiting for services"
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Run API & E2E tests
        run: |
          ./gradlew test --no-daemon \
            --tests 'com.shawarmashop.tests.e2e.showcase.*'

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: build/allure-results
          retention-days: 7

      - name: Dump docker logs on failure
        if: failure()
        run: docker compose logs --no-color

  ui-tests:
    name: UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: api-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Start infrastructure
        run: docker compose up -d

      - name: Wait for services to be healthy
        run: |
          set -e
          echo "Waiting for all containers to report healthy..."
          for i in $(seq 1 60); do
            unhealthy=$(docker compose ps --format json \
              | jq -r 'select(.Health != "" and .Health != "healthy") | .Name' \
              | tr '\n' ' ')
            if [ -z "$unhealthy" ]; then
              echo "All services healthy."
              exit 0
            fi
            echo "[$i/60] Waiting for: $unhealthy"
            sleep 5
          done
          echo "::error::Timeout waiting for services"
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Run UI tests under xvfb
        run: |
          xvfb-run -a ./gradlew test --no-daemon \
            --tests 'com.shawarmashop.tests.ui.tests.*'

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui
          path: build/allure-results
          retention-days: 7

      - name: Dump docker logs on failure
        if: failure()
        run: docker compose logs --no-color

  publish-allure:
    name: Publish Allure report
    runs-on: ubuntu-latest
    needs: [ api-tests, ui-tests ]
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download API Allure results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results-api
          path: allure-results-api

      - name: Download UI Allure results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results-ui
          path: allure-results-ui

      - name: Merge Allure results
        run: |
          mkdir -p allure-results
          cp -r allure-results-api/* allure-results/ 2>/dev/null || true
          cp -r allure-results-ui/* allure-results/ 2>/dev/null || true
          echo "Merged allure results:"
          ls -la allure-results/ || echo "No allure results"

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@v1.12
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history